name: Build Mod Jar

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unzip source files
        run: |
          unzip -o dranant-v5.0.0-src.zip

      - name: Build with Gradle
        run: |
          gradle build --no-daemon

      - name: Upload Mod Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dranant-5.0.0-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v5.1.0
          name: "Doctor Anant Mod v5.1"
          body: "Official release jar for Doctor Anant Mod v5.1 (Minecraft 1.21.1 / NeoForge)"
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
