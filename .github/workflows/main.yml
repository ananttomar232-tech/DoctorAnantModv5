name: Convert Zip to Jar

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inspect and Extract Zip
        run: |
          echo "=== 1. Checking Repository Zip ==="
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Koi zip file nahi mili repo me!"
            exit 1
          fi
          echo "Found zip: $ZIP_FILE"
          
          echo "=== 2. Zip content preview ==="
          unzip -l "$ZIP_FILE" | head -n 35

          echo "=== 3. Extracting Zip ==="
          unzip -q -o "$ZIP_FILE" -d project_extracted
          ls -la project_extracted

      - name: Auto-Detect and Build Mod
        run: |
          echo "=== 4. Detecting Project Type ==="
          mkdir -p final_jar

          # Check if gradlew exists anywhere
          GRADLEW_FILE=$(find project_extracted -name "gradlew" | head -n 1)
          BUILD_GRADLE=$(find project_extracted -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          POM_FILE=$(find project_extracted -name "pom.xml" | head -n 1)

          if [ -n "$GRADLEW_FILE" ]; then
            P_DIR=$(dirname "$GRADLEW_FILE")
            echo "Found gradlew in: $P_DIR"
            cd "$P_DIR"
            chmod +x gradlew
            ./gradlew build --no-daemon || ./gradlew assemble --no-daemon
            cd -
          elif [ -n "$BUILD_GRADLE" ]; then
            P_DIR=$(dirname "$BUILD_GRADLE")
            echo "Found build.gradle in: $P_DIR (using system gradle)"
            cd "$P_DIR"
            gradle build --no-daemon || gradle assemble --no-daemon
            cd -
          elif [ -n "$POM_FILE" ]; then
            P_DIR=$(dirname "$POM_FILE")
            echo "Found Maven project in: $P_DIR"
            cd "$P_DIR"
            mvn clean package -DskipTests
            cd -
          else
            echo "No build system found. Compiling raw Java files..."
            cd project_extracted
            # Agar single folder ke andar files hain toh andar jao
            SUBFOLDER=$(find . -maxdepth 1 -mindepth 1 -type d | head -n 1)
            if [ -n "$SUBFOLDER" ] && [ $(find . -maxdepth 1 -mindepth 1 | wc -l) -eq 1 ]; then
              cd "$SUBFOLDER"
            fi
            
            find . -name "*.java" > sources.txt
            if [ -s sources.txt ]; then
              mkdir -p bin
              javac -d bin @sources.txt || true
              jar -cvf ../../final_jar/mod.jar -C bin .
            else
              jar -cvf ../../final_jar/mod.jar *
            fi
            cd -
          fi

          echo "=== 5. Collecting all built JARs ==="
          find . -name "*.jar" ! -path "*/.gradle/*" ! -path "*/gradle/*" ! -path "./final_jar/*" -exec cp {} final_jar/ \;
          ls -la final_jar/

      - name: Download Built Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: Built-Mod-Jar
          path: final_jar/*.jar
          if-no-files-found: warn
