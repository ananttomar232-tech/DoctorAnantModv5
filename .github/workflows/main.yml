name: Convert Zip to Jar

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip files
        run: |
          unzip -o *.zip
          # Agar files kisi folder ke andar nikli hain toh unhe root me le aao
          if [ ! -f "gradlew" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Moving files from $SUBDIR to root..."
              cp -r $SUBDIR/* .
            fi
          fi
          chmod +x gradlew || true

      - name: Build with Gradle
        run: |
          ./gradlew build --stacktrace

      - name: Find and Save Jar File
        uses: actions/upload-artifact@v4
        with:
          name: Built-Mod-Jar
          path: |
            build/libs/*.jar
            **/build/libs/*.jar
